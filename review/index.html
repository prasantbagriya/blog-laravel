<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          const origFetch = window.fetch;
          let _fetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _fetch;
            },
            set(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore error if property is non-configurable
        }
      })();
    </script>
